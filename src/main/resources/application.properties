server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:app_runtime}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.swagger-ui.path=/docs
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.crypto.encryption-key=${DATA_ENCRYPTION_KEY}
app.crypto.index-key=${DATA_INDEX_KEY}
chat.ai.api-key=${GEMINI_API_KEY}
chat.ai.model=${GEMINI_MODEL:gemini-3.6-flash}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false