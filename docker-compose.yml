version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ingresse_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # A linha do init.sql foi removida daqui. O Spring Boot fará a inicialização.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ingresse_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: .
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/ingresse_ai
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
      - JWT_SECRET=${JWT_SECRET:-chave-super-secreta-para-jwt-com-mais-de-32-caracteres}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: